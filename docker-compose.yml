services:
  psnself:
    container_name: psnself
    build: .
    ports:
      - "8420:8420"
    volumes:
      - ~/.config/psnself:/root/.config/psnself
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      PSNSELF_API_KEY: ${PSNSELF_API_KEY:-}
    restart: unless-stopped
